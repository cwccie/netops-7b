[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "netops-7b"
version = "0.1.0"
description = "QLoRA fine-tuning pipeline for NetOps-7B — a network operations language model"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Corey A. Wade", email = "corey@coreywade.com" },
]
keywords = ["llm", "fine-tuning", "qlora", "network-operations", "cisco", "juniper", "arista"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Networking",
]
dependencies = [
    "torch>=2.1.0",
    "transformers>=4.36.0",
    "datasets>=2.16.0",
    "peft>=0.7.0",
    "trl>=0.7.0",
    "bitsandbytes>=0.41.0",
    "accelerate>=0.25.0",
    "unsloth>=2024.1",
    "click>=8.1.0",
    "rich>=13.0.0",
    "rouge-score>=0.1.2",
    "bert-score>=0.3.13",
    "gradio>=4.0.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "xxhash>=3.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]

[project.scripts]
netops = "netops_7b.cli:cli"

[project.urls]
Homepage = "https://github.com/cwccie/netops-7b"
Documentation = "https://github.com/cwccie/netops-7b#readme"
Repository = "https://github.com/cwccie/netops-7b"
"Model Card" = "https://huggingface.co/cwccie/netops-7b"
Issues = "https://github.com/cwccie/netops-7b/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/netops_7b"]

[tool.ruff]
target-version = "py39"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["netops_7b"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
